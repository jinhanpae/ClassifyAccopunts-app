<!--
  Account Classification Practice App
  © 2026 Jinhan Pae. All rights reserved.

  Description:
  - Web-based practice app for introductory financial accounting.
  - Students classify common accounts by type, normal balance, and contra‑status.
  - Supports basic and extended account sets, scores first and second attempts,
    and shows a session summary at the end.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Classification</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #4b5563;
      --line: #d1d5db;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .container {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
    }

    .header {
      padding: 34px 0 28px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 0;
      color: #6b7280;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
    }

    .view { padding: 0 0 28px; }
    .hidden { display: none !important; }

    .login-form {
      width: min(100%, 420px);
      margin: 24px auto 60px;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-weight: 600;
    }

    input, select { font: inherit; }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 18px;
      font-size: 1rem;
    }

    .form-group input:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.2);
      outline-offset: 2px;
    }

    .error-message {
      min-height: 24px;
      margin-top: 12px;
      color: #b91c1c;
      text-align: center;
    }

    .btn {
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 10px 24px;
      background: #fff;
      color: #374151;
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      border-color: #9ca3af;
      background: #f9fafb;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .btn-small {
      padding: 7px 14px;
      border-radius: 18px;
      font-size: .9rem;
      white-space: nowrap;
    }

    .btn-info { color: #1d4ed8; }

    .controls {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      margin: 12px 0 40px;
      min-height: 62px;
    }

    .control-group { min-width: 0; }

    .control-group label {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: .98rem;
    }

    #difficultySelect {
      min-width: 190px;
      padding: 10px 34px 10px 14px;
      border: 2px solid var(--line);
      border-radius: 22px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .score-inline {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  padding-bottom: 8px;
  color: var(--muted);
  white-space: nowrap;
  font-size: 1.05rem;
}

    .score-inline strong {
      color: var(--ink);
      font-size: 1.18rem;
    }

    .question-area {
      margin-bottom: 24px;
      padding: 0;
      text-align: center;
    }

    .account-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 76px;
      margin-bottom: 24px;
      padding: 18px 22px;
      border: 2px solid #e5e7eb;
      border-radius: 24px;
      background: linear-gradient(105deg, #fff 35%, #f8fbff 100%);
    }

    .account-name {
      min-width: 0;
      font-size: clamp(1.45rem, 4vw, 2.1rem);
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 1.15rem;
      font-weight: 700;
      text-align: left;
    }

    .btn-icon-info {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: none;
      color: var(--blue);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .btn-icon-info:hover {
      background: #eff6ff;
    }

    .segmented-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-start;
    }

    .balance-and-contra {
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}

.balance-and-contra .checkbox-group {
  margin: 0;
}

    
    .segmented-button {
      padding: 9px 18px;
      border: 2px solid var(--line);
      border-radius: 22px;
      background: #fff;
      color: #374151;
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
    }

    .segmented-button:hover:not(:disabled) {
      border-color: #9ca3af;
      background: #f9fafb;
    }

    .segmented-button.active {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .checkbox-group {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 1.05rem;
  font-weight: 600;
  text-align: left;
}

.checkbox-group input {
  width: 22px;
  height: 22px;
}

.checkbox-group label {
  margin: 0;
}

    .feedback {
      margin: 18px 0;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .feedback.correct { background: #ecfdf5; color: #166534; border: 1px solid #bbf7d0; }
    .feedback.incorrect { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .action-buttons .btn { flex: 0 1 auto; }

    .report-backdrop,
    .explanation-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(17, 24, 39, .55);
    }

    .report-backdrop.show,
    .explanation-backdrop.show { display: flex; }

    .report-summary,
    .explanation-dialog {
      width: min(100%, 620px);
      max-height: 88vh;
      overflow: auto;
      padding: 24px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .2);
    }

    .report-summary h2,
    .explanation-dialog h2 {
      margin: 0 0 18px;
      color: var(--ink);
      font-size: 1.4rem;
    }

    .report-meta {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f8fafc;
    }

    .report-meta p { margin: 6px 0; }
    .report-summary li { margin: 7px 0; }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .footer {
      padding: 20px 0;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: .9rem;
      text-align: center;
    }

    @media (max-width: 650px) {
      .container { width: min(100% - 24px, 900px); }
      .header { padding-top: 24px; }
      .controls { align-items: flex-start; flex-wrap: wrap; margin-bottom: 26px; }
      .score-inline { width: 100%; margin-left: 0; padding: 0; }
      .account-heading { justify-content: space-between; border-radius: 20px; }
      .account-name { text-align: left; }
      .action-buttons .btn { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Account Classification</h1>
      <p>Financial Accounting · Account Types and Normal Balances</p>
    </header>

    <section id="loginView" class="view">
      <div class="login-form">
        <div class="form-group">
          <label for="studentNameInput">Name</label>
          <input type="text" id="studentNameInput" placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" placeholder="Enter password">
        </div>
        <button id="loginBtn" class="btn btn-primary" type="button">Start</button>
        <div id="loginError" class="error-message"></div>
      </div>
    </section>

    <section id="appView" class="view hidden">
        <div class="controls">
            <div class="control-group">
              <label for="difficultySelect">Data set</label>
              <select id="difficultySelect">
                <option value="basic">Basic</option>
                <option value="extended-only">Extended Only</option>
                <option value="basic-and-extended">Basic + Extended</option>
              </select>
            </div>
          
            <div class="score-inline" aria-live="polite">
              <span>Score: <strong id="score">0.0</strong></span>
              <span>/ <strong id="total">0</strong> questions</span>
            </div>
          </div>

      <div class="question-area">
        <div class="account-heading">
          <div class="account-name" id="accountName">Loading...</div>
          <button id="explainBtnSmall" class="btn btn-small btn-info" type="button" disabled>Explain</button>
        </div>

        <div class="section-label">
          Account type
          <button id="typeInfoBtn" class="btn-icon-info" type="button" aria-label="About account types" aria-haspopup="dialog">ⓘ</button>
        </div>
        <div class="segmented-buttons" id="typeButtons">
          <button class="segmented-button" data-type="Asset" type="button">Assets</button>
          <button class="segmented-button" data-type="Liability" type="button">Liabilities</button>
          <button class="segmented-button" data-type="Equity" type="button">Equity</button>
          <button class="segmented-button" data-type="Revenue" type="button">Revenues</button>
          <button class="segmented-button" data-type="Expense" type="button">Expenses</button>
          <button class="segmented-button" data-type="Other" type="button">Other Items</button>
        </div>

        <div class="section-label">Normal balance</div>

        <div class="balance-and-contra">
          <div class="segmented-buttons" id="balanceButtons">
            <button class="segmented-button" data-balance="Debit" type="button">Debit</button>
            <button class="segmented-button" data-balance="Credit" type="button">Credit</button>
          </div>
        
          <div class="checkbox-group">
            <input type="checkbox" id="contraCheckbox">
            <label for="contraCheckbox">Contra-account</label>
          </div>
        </div>

      <div id="feedback" class="feedback" style="display:none"></div>

      <div class="action-buttons">
        <button id="submitBtn" class="btn btn-primary" type="button">Submit answer</button>
        <button id="nextBtn" class="btn" type="button">Next account</button>
        <button id="reportBtn" class="btn" type="button">Report</button>
      </div>
    </section>

    <footer class="footer">© 2026 Jinhan Pae. All rights reserved.</footer>
  </main>

  <div id="reportBackdrop" class="report-backdrop" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <div class="report-summary">
      <h2 id="reportTitle">Session Report</h2>
      <div id="reportContent"></div>
      <div class="modal-actions">
        <button id="continueSessionBtn" class="btn" type="button">Continue</button>
        <button id="startNewSessionBtn" class="btn btn-primary" type="button">Start new session</button>
      </div>
    </div>
  </div>

  <div id="typeInfoBackdrop" class="explanation-backdrop" role="dialog" aria-modal="true" aria-labelledby="typeInfoTitle">
    <div class="explanation-dialog">
      <h2 id="typeInfoTitle">About account types</h2>
      <div id="typeInfoContent"></div>
      <div class="modal-actions">
        <button id="closeTypeInfoBtn" class="btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <div id="explanationBackdrop" class="explanation-backdrop" role="dialog" aria-modal="true" aria-labelledby="explanationTitle">
    <div class="explanation-dialog">
      <h2 id="explanationTitle">Account explanation</h2>
      <div id="explanationContent"></div>
      <div class="modal-actions">
        <button id="closeExplanationBtn" class="btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="chartOfAccounts.js"></script>
  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
